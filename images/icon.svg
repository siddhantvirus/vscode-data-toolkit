<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer background (dark blue) -->
  <rect width="128" height="128" rx="22" fill="#1a56a0"/>
  <!-- Inner background (mid blue) -->
  <rect x="4" y="4" width="120" height="120" rx="18" fill="#2c7fdb"/>
  <!-- Subtle top highlight -->
  <rect x="4" y="4" width="120" height="58" rx="18" fill="rgba(255,255,255,0.06)"/>

  <!-- Table card shadow -->
  <rect x="14" y="17" width="100" height="76" rx="7" fill="rgba(0,0,0,0.28)"/>

  <!-- Table card body -->
  <rect x="13" y="15" width="100" height="76" rx="7" fill="rgba(0,0,0,0.22)"/>

  <!-- Header row background -->
  <rect x="13" y="15" width="100" height="21" rx="7" fill="rgba(0,0,0,0.38)"/>
  <rect x="13" y="26" width="100" height="10" fill="rgba(0,0,0,0.38)"/>

  <!-- Header cell pills (column name labels) -->
  <rect x="19" y="20" width="22" height="9" rx="4" fill="rgba(255,255,255,0.95)"/>
  <rect x="51" y="20" width="22" height="9" rx="4" fill="rgba(255,255,255,0.95)"/>
  <rect x="83" y="20" width="22" height="9" rx="4" fill="rgba(255,255,255,0.95)"/>

  <!-- Column dividers -->
  <line x1="46" y1="36" x2="46" y2="88" stroke="rgba(255,255,255,0.17)" stroke-width="1.5"/>
  <line x1="79" y1="36" x2="79" y2="88" stroke="rgba(255,255,255,0.17)" stroke-width="1.5"/>

  <!-- Row dividers -->
  <line x1="13" y1="49" x2="113" y2="49" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
  <line x1="13" y1="62" x2="113" y2="62" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
  <line x1="13" y1="75" x2="113" y2="75" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="19" y="38" width="17" height="6" rx="3" fill="rgba(255,255,255,0.82)"/>
  <rect x="51" y="38" width="21" height="6" rx="3" fill="rgba(255,255,255,0.82)"/>
  <rect x="83" y="38" width="13" height="6" rx="3" fill="rgba(255,255,255,0.82)"/>

  <!-- Row 2 -->
  <rect x="19" y="51" width="21" height="6" rx="3" fill="rgba(255,255,255,0.66)"/>
  <rect x="51" y="51" width="14" height="6" rx="3" fill="rgba(255,255,255,0.66)"/>
  <rect x="83" y="51" width="19" height="6" rx="3" fill="rgba(255,255,255,0.66)"/>

  <!-- Row 3 -->
  <rect x="19" y="64" width="14" height="6" rx="3" fill="rgba(255,255,255,0.50)"/>
  <rect x="51" y="64" width="19" height="6" rx="3" fill="rgba(255,255,255,0.50)"/>
  <rect x="83" y="64" width="16" height="6" rx="3" fill="rgba(255,255,255,0.50)"/>

  <!-- Row 4 -->
  <rect x="19" y="77" width="19" height="6" rx="3" fill="rgba(255,255,255,0.34)"/>
  <rect x="51" y="77" width="16" height="6" rx="3" fill="rgba(255,255,255,0.34)"/>
  <rect x="83" y="77" width="12" height="6" rx="3" fill="rgba(255,255,255,0.34)"/>

  <!-- Bottom badges -->
  <!-- SQL badge (orange-red) -->
  <rect x="13" y="100" width="38" height="17" rx="6" fill="#d84315"/>
  <text x="32" y="112" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" font-weight="bold" fill="white" letter-spacing="0.5">SQL</text>

  <!-- f(x) badge (teal) -->
  <rect x="56" y="100" width="30" height="17" rx="6" fill="#00695c"/>
  <text x="71" y="112" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="10" font-weight="bold" font-style="italic" fill="white">f(x)</text>

  <!-- Venn / compare badge (deep indigo) -->
  <rect x="91" y="100" width="22" height="17" rx="6" fill="#283593"/>
  <circle cx="98" cy="108.5" r="5" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.7"/>
  <circle cx="105" cy="108.5" r="5" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.7"/>
</svg>
