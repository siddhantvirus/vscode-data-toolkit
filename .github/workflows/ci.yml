name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. `branches:` here filters by the *target* branch, so
  # `[main]` silently skipped stacked pull requests — one PR based on another
  # got no checks at all. Every pull request should be verified regardless of
  # what it targets.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Check types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run package

      - name: Test
        run: xvfb-run -a npm test
