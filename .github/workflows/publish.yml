name: Publish

# Manual dispatch only — deliberately no tag trigger, so there is exactly one
# path to the marketplace token. Triggering requires write access; the
# protected `release` environment then pauses for maintainer approval before
# any secret is injected.
#
# Note: this workflow must be on the default branch for the "Run workflow"
# button to appear.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package only — do not publish'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Verify
        run: |
          npm run check-types
          npm run lint

      - name: Build
        run: npm run package

      - name: Package VSIX
        run: npx @vscode/vsce package --out data-toolkit.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-toolkit-vsix
          path: data-toolkit.vsix

      # The secret starts life as a placeholder so the environment can be set
      # up before the real token exists. Fail here with an explicit message
      # rather than letting vsce report an opaque 401 after a full build.
      - name: Verify marketplace token is real
        if: ${{ !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set on the 'release' environment."
            exit 1
          fi
          if [ "$VSCE_PAT" = "PLACEHOLDER_SET_REAL_VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is still the placeholder. Add the real Azure DevOps PAT as an environment secret on 'release', then re-run. Use dry_run to test the pipeline without publishing."
            exit 1
          fi

      # Stable channel — do not add --pre-release unless deliberately moving
      # the listing to the pre-release channel.
      - name: Publish to Marketplace
        if: ${{ !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath data-toolkit.vsix
